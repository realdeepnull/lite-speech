<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>lite-speech M1 spike — Phonon 31M EN</title>
    <style>
      body {
        font:
          14px/1.5 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        margin: 0 auto;
        max-width: 60rem;
        padding: 1.5rem;
        color: #1a1a1a;
      }
      h1 {
        font-size: 1.25rem;
      }
      fieldset {
        border: 1px solid #ccc;
        padding: 0.75rem;
      }
      label {
        display: block;
        margin: 0.5rem 0 0.25rem;
      }
      textarea,
      pre {
        width: 100%;
        box-sizing: border-box;
      }
      pre {
        background: #f5f5f5;
        padding: 0.75rem;
        overflow: auto;
        max-height: 26rem;
      }
      button,
      select {
        font: inherit;
        padding: 0.25rem 0.5rem;
      }
      .row {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        margin-top: 0.75rem;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "@huggingface/transformers": "/spike/node_modules/@huggingface/transformers/dist/transformers.min.js"
        }
      }
    </script>
  </head>
  <body>
    <h1>M1 inference spike — Phonon 31M EN</h1>
    <p>
      Same low-level path as <code>spike/node.mjs</code>, running against the installed
      <code>@huggingface/transformers</code> build with no bundler. Serve the repository root with
      <code>node spike/serve.mjs</code> and open this page from that origin.
    </p>

    <fieldset>
      <legend>WebGPU</legend>
      <pre data-role="gpu">probing…</pre>
    </fieldset>

    <fieldset>
      <legend>Run</legend>
      <label for="config">Configuration</label>
      <select id="config" data-role="config">
        <option value="fp32/wasm">fp32 / wasm (baseline, largest download)</option>
        <option value="q4/wasm" selected>q4 / wasm</option>
        <option value="q4f16/webgpu">q4f16 / webgpu (needs shader-f16)</option>
        <option value="fp32/webgpu">fp32 / webgpu</option>
      </select>

      <label for="text">Text</label>
      <textarea id="text" data-role="text" rows="3">
Hello from lite-speech. This is the second sentence of the inference spike.</textarea>

      <div class="row">
        <button data-role="run">Synthesize</button>
        <button data-role="play" disabled>Play</button>
        <span data-role="status">booting…</span>
      </div>
    </fieldset>

    <h2>Report</h2>
    <pre data-role="log"></pre>

    <script type="module" src="./main.js"></script>
  </body>
</html>
